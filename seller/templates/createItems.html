<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Product Listing</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f8fafc;
            color:#1e293b;
        }

        /* HEADER */
        header{
            background:cadetblue;
            padding:20px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 2px 10px rgba(0,0,0,.05);
        }

        .logo{
            color:white;
            font-size:1.8rem;
            font-weight:bold;
        }

        .dashboard-link{
            text-decoration:none;
            color:white;
            font-weight:600;
            padding:10px 18px;
            border:1px solid white;
            border-radius:8px;
            transition:.3s;
        }

        .dashboard-link:hover{
            background:white;
            color:cadetblue;
        }

        /* MAIN SECTION */
        .create-section{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:90vh;
            padding:40px 20px;
        }

        .create-card{
            background:white;
            width:100%;
            max-width:650px;
            padding:40px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }

        .create-card h2{
            text-align:center;
            color:cadetblue;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#64748b;
            margin-bottom:30px;
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
        }

        .input,
        textarea,
        select{
            width:100%;
            padding:12px;
            border:2px solid #cbd5e1;
            border-radius:8px;
            font-size:1rem;
            outline:none;
            transition:.3s;
            background:white;
        }

        .input:focus,
        textarea:focus,
        select:focus{
            border-color:cadetblue;
            box-shadow:0 0 5px rgba(95,158,160,.4);
        }

        textarea{
            resize:vertical;
        }

        .error{
            color:#dc2626;
            text-align:center;
            margin-bottom:15px;
        }

        .success{
            color:#16a34a;
            text-align:center;
            margin-bottom:15px;
        }

        .button-group{
            display:flex;
            gap:15px;
            margin-top:25px;
        }

        .btn{
            flex:1;
            padding:14px;
            border:none;
            border-radius:8px;
            text-decoration:none;
            text-align:center;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        .btn-primary{
            background:cadetblue;
            color:white;
        }

        .btn-primary:hover{
            background:#4f8f92;
        }

        .btn-secondary{
            background:#e2e8f0;
            color:#1e293b;
        }

        .btn-secondary:hover{
            background:#cbd5e1;
        }
        @media(max-width:768px){

            header{
                flex-direction:column;
                gap:12px;
            }

            .create-card{
                padding:25px;
            }

            .button-group{
                flex-direction:column;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Marketplace</div>

            <a href="/Slogout/" class="dashboard-link">
                Logout
            </a>
    </header>

    <section class="create-section">

        <div class="create-card">

            <h2>Add a New Product</h2>

            <p class="subtitle">
                Create a product listing and start selling to buyers on the marketplace.
            </p>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            {% if message %}
                <p class="success">{{ message }}</p>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="form-group">
                    <label for="item_image">Product Image</label>
                    <input
                        class="input"
                        type="file"
                        id="item_image"
                        name="item_image"
                        accept="image/*"
                        required>
                </div>

                <div class="form-group">
                    <label for="title">Product Name</label>
                    <input
                        class="input"
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter product name"
                        required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Describe your product..."></textarea>
                </div>

                <div class="form-group">
                    <label for="price">Price (₦)</label>
                    <input
                        class="input"
                        type="number"
                        id="price"
                        name="price"
                        placeholder="Enter price"
                        required>
                </div>
                
                <div class="form-group">
                    <label for="quantity">Available Quantity</label>
                    <input
                        class="input"
                        type="number"
                        id="quantity"
                        name="quantity"
                        placeholder="Enter quantity in stock"
                        min="1"
                        value="1"
                        required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" name="category">
                        <option value="">Select Category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Phones">Phones</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Home & Kitchen">Home & Kitchen</option>
                        <option value="Beauty">Beauty</option>
                        <option value="Books">Books</option>
                        <option value="Sports">Sports</option>
                        <option value="Foods">Foods</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="button-group">

                    <button type="submit" class="btn btn-primary">
                        Add Product
                    </button>

                    <a href="/sellerDash/" class="btn btn-secondary">
                        Back to Dashboard
                    </a>

                </div>
            </form>
        </div>
    </section>
</body>
</html>
